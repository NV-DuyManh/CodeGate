name: CodeGate CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-audit:
    name: CodeGate / Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Python Dependency Audit (pip-audit)
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r requirements.txt
          
      - name: Bandit Security Scan
        run: |
          pip install bandit==1.9.4
          bandit -r codegate tools -ll -ii

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          
      - name: NPM Dependency Audit
        working-directory: ./dashboard
        run: |
          npm audit

  backend-tests:
    name: CodeGate / Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          
      - name: Ruff Check
        run: |
          ruff check codegate tools
          
      - name: Pytest
        env:
          PYTHONPATH: .
        run: |
          pytest tests/codegate -q

  frontend-tests:
    name: CodeGate / Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "dashboard/package-lock.json"
          
      - name: Install dependencies
        working-directory: ./dashboard
        run: npm ci
        
      - name: Lint
        working-directory: ./dashboard
        run: npm run lint
        
      - name: Test
        working-directory: ./dashboard
        run: npm run test:run
        
      - name: Build
        working-directory: ./dashboard
        run: npm run build

  postgres-ci:
    name: CodeGate / PostgreSQL
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg2://codegate:ci_password_only@localhost:5432/codegate
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codegate
          POSTGRES_PASSWORD: ci_password_only
          POSTGRES_DB: codegate
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Alembic Upgrade Head
        run: |
          alembic upgrade head
          
      - name: Verify Single Head
        run: |
          python - <<'PY'
          import os
          from alembic.config import Config
          from alembic.runtime.migration import MigrationContext
          from alembic.script import ScriptDirectory
          from sqlalchemy import create_engine

          expected = set(ScriptDirectory.from_config(Config("alembic.ini")).get_heads())
          if len(expected) != 1:
              raise SystemExit(f"Expected one migration head, found: {sorted(expected)}")
          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as connection:
              current = set(MigrationContext.configure(connection).get_current_heads())
          engine.dispose()
          if current != expected:
              raise SystemExit(f"Database heads {sorted(current)} differ from migration heads {sorted(expected)}")
          print(f"Database is at the single migration head: {next(iter(current))}")
          PY
          
      - name: Postgres CRUD Test
        env:
          PYTHONPATH: .
        run: |
          python tools/test_postgres_crud.py

  docker-ci:
    name: CodeGate / Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Validate Compose Config
        run: |
          docker compose -f compose.codegate.yml config
          
      - name: Build Backend Image
        run: |
          docker build -f docker/Dockerfile.codegate_backend .
          
      - name: Build Frontend Image
        run: |
          docker build -f docker/Dockerfile.codegate_frontend .

  upstream-regression:
    name: Upstream PR-Agent Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install PR-Agent dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          
      - name: Run Upstream Tests
        env:
          PYTHONPATH: .
        run: |
          pytest tests/unittest -q
